<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio interactif : conduisez une petite voiture dans un monde isométrique en pixel art pour découvrir mes projets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <!-- ?v=… : à changer à chaque mise en ligne, pour que le navigateur ne mélange
       jamais d'anciens et de nouveaux fichiers (GitHub Pages les garde 10 min en cache) -->
  <link rel="stylesheet" href="css/style.css?v=10">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "./js/main.js": "./js/main.js?v=10",
        "./js/data.js": "./js/data.js?v=10",
        "./js/world.js": "./js/world.js?v=10",
        "./js/car.js": "./js/car.js?v=10",
        "./js/ui.js": "./js/ui.js?v=10",
        "./js/minimap.js": "./js/minimap.js?v=10",
        "./js/particles.js": "./js/particles.js?v=10",
        "./js/landmarks.js": "./js/landmarks.js?v=10",
        "./js/bake.js": "./js/bake.js?v=10"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="card id-card">
      <div class="hud-name" id="hud-name"></div>
      <div class="hud-role" id="hud-role"></div>
    </div>
    <div class="hud-actions">
      <button class="px-btn" id="btn-list" title="Liste des projets">☰ Projets</button>
      <button class="px-btn" id="btn-help" title="Commandes">?</button>
    </div>
  </div>

  <!-- Zoom (petits écrans / tactile) -->
  <div id="zoom">
    <button class="px-btn zoom-btn plus" id="btn-zoom-in" aria-label="Zoomer"></button>
    <button class="px-btn zoom-btn" id="btn-zoom-out" aria-label="Dézoomer"></button>
  </div>

  <canvas id="minimap" width="132" height="132" aria-hidden="true"></canvas>

  <div id="controls-hint" class="card">
    <span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> / flèches : se déplacer</span>
    <span><kbd>Espace</kbd> / <kbd>E</kbd> entrer</span>
    <span><kbd>R</kbd> respawn</span>
  </div>

  <button id="prompt" class="card" hidden></button>

  <!-- Contrôles à l'écran (petits écrans et écrans tactiles) -->
  <div id="touch">
    <div id="stick" class="stick" role="application" aria-label="Joystick : faites glisser pour conduire">
      <div class="knob"></div>
    </div>
    <button id="btn-enter" class="enter" disabled aria-label="Entrer dans le bâtiment">ENTRER</button>
  </div>

  <!-- Panneau (projet, à propos, liste...) -->
  <div id="overlay" hidden>
    <div id="panel" class="card" role="dialog" aria-modal="true">
      <button class="close" data-close aria-label="Fermer">✕</button>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- Écran d'accueil -->
  <div id="intro">
    <div class="card intro-card" id="intro-card">
      <p class="loading">Chargement…</p>
    </div>
  </div>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">Ce portfolio a besoin de JavaScript et de WebGL.</p>
  </noscript>

  <script type="module">import './js/main.js';</script>
</body>
</html>
